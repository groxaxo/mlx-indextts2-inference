<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">IndexTTS — Apple MLX and NVIDIA CUDA</title>
  <desc id="desc">Expressive multilingual voice cloning across Apple Silicon and NVIDIA GPUs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050814"/>
      <stop offset="0.45" stop-color="#11152A"/>
      <stop offset="1" stop-color="#071A14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.48" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#76B900"/>
    </linearGradient>
    <radialGradient id="leftGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#76B900" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#76B900" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur"/>
      <feOffset in="blur" dx="0" dy="12" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.42" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="32" fill="url(#bg)"/>
  <circle cx="260" cy="90" r="270" fill="url(#leftGlow)" filter="url(#blur)"/>
  <circle cx="1390" cy="425" r="310" fill="url(#rightGlow)" filter="url(#blur)"/>

  <g opacity="0.12" stroke="#E2E8F0" stroke-width="1">
    <path d="M0 80H1600M0 160H1600M0 240H1600M0 320H1600M0 400H1600M0 480H1600"/>
    <path d="M100 0V520M300 0V520M500 0V520M700 0V520M900 0V520M1100 0V520M1300 0V520M1500 0V520"/>
  </g>

  <g transform="translate(92 84)" filter="url(#shadow)">
    <rect width="1416" height="352" rx="28" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <rect x="1" y="1" width="1414" height="5" rx="3" fill="url(#accent)"/>

    <g transform="translate(58 60)">
      <text x="0" y="62" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="66" font-weight="800" letter-spacing="-2">IndexTTS</text>
      <text x="0" y="112" fill="#B9C3D5" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="500">Expressive multilingual voice cloning</text>
      <text x="0" y="151" fill="#7F8EA8" font-family="Inter,Arial,sans-serif" font-size="18">IndexTTS 2.0 + 2.5 · emotion control · local inference</text>

      <g transform="translate(0 190)">
        <rect width="220" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15"/>
        <circle cx="28" cy="24" r="10" fill="#A78BFA"/>
        <text x="49" y="31" fill="#F8FAFC" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="650">Apple Silicon · MLX</text>
      </g>
      <g transform="translate(236 190)">
        <rect width="224" height="48" rx="24" fill="#76B900" fill-opacity="0.12" stroke="#76B900" stroke-opacity="0.45"/>
        <path d="M19 24c10-14 23-14 34 0-11 14-24 14-34 0zm8 0c5 7 12 7 18 0-6-7-13-7-18 0z" fill="#76B900"/>
        <text x="58" y="31" fill="#F4FCE8" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="650">NVIDIA · CUDA</text>
      </g>
    </g>

    <g transform="translate(770 62)">
      <rect width="575" height="228" rx="24" fill="#020617" fill-opacity="0.58" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="28" y="42" fill="#7F8EA8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">VOICE PIPELINE</text>
      <g transform="translate(30 76)" fill="none" stroke-linecap="round">
        <path d="M0 63 C24 63 22 18 48 18 S72 108 98 108 S124 36 150 36 S176 86 202 86 S228 10 254 10 S280 112 306 112 S332 46 358 46 S384 80 410 80 S436 26 462 26 S488 64 515 64" stroke="url(#accent)" stroke-width="5"/>
        <path d="M0 63 C24 63 22 18 48 18 S72 108 98 108 S124 36 150 36 S176 86 202 86 S228 10 254 10 S280 112 306 112 S332 46 358 46 S384 80 410 80 S436 26 462 26 S488 64 515 64" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="12"/>
      </g>
      <g transform="translate(30 184)" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650">
        <text fill="#C4B5FD">speaker</text>
        <text x="124" fill="#67E8F9">emotion</text>
        <text x="246" fill="#A7F3D0">multilingual</text>
        <text x="392" fill="#BEF264">GPU-native</text>
      </g>
    </g>
  </g>
</svg>
